<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>OFF—MAP · GIF stage</title>
<!-- GIF stage: one story per GIF. Left = the map (camera never moves), right = topic, one question, the two sides in identical units, the gap ×N, the source.
     gif.html?g=<id>&lang=ar|he|en            plays live
     gif.html?g=<id>&lang=ar&f=all            stacks every frame vertically (used by scripts/make_gifs.py to export the .gif files)
     ids: homes, localities, industry, arnona, bus, school, bagrut, sport, sportdist -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700;800&family=Alexandria:wght@400;600;800&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d0d0d;--concrete:#8a8a86;--bone:#e9e6df;--red:#e8452c;--line:#3a3a38;--font:"Alexandria","Jost","Dubai","Segoe UI",sans-serif}
html[lang=he]{--font:"Rubik","Jost","Segoe UI",sans-serif} html[lang=en]{--font:"Jost","Segoe UI",sans-serif}
*{box-sizing:border-box} html,body{margin:0;background:#000;color:var(--bone);font-family:var(--font)}
.fr{position:relative;width:1200px;height:675px;overflow:hidden;background:var(--ink);display:flex;direction:ltr}
.mp{position:relative;width:700px;height:675px;flex:none;background:#0a0a0a;overflow:hidden}
.mp canvas{position:absolute;inset:0}
.lb{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:600;white-space:nowrap;background:rgba(0,0,0,.74);padding:1px 5px 2px;line-height:1.2;text-align:center}
.lb.b{transform:translate(-50%,0)} .lb.t{transform:translate(-50%,-100%)} .lb.r{transform:translate(0,-50%)} .lb.l{transform:translate(-100%,-50%)}
.lb.j{color:#b9b7b1} .lb.a{color:#fff} .lb small{font-family:"Jost";font-weight:800;font-size:13px;margin-inline-start:5px;direction:ltr;display:inline-block}
.lb.a small{color:#ff6a4d}
.lgd{position:absolute;left:10px;bottom:10px;background:#000c;border:1px solid var(--line);padding:7px 9px;font-size:11.5px;line-height:1.75;max-width:330px}
.lgd i{display:inline-block;width:11px;height:11px;margin-inline-end:6px;vertical-align:-1px}
.lgd i.c{border-radius:50%}
.sc{position:absolute;right:14px;top:14px;font-family:"Jost";font-size:11px;color:var(--concrete);text-align:center;direction:ltr}
.sc b{display:block;height:5px;border:1px solid var(--concrete);border-top:0;margin-bottom:2px}
.south{position:absolute;left:505px;top:543px;width:187px;height:124px;border:1px dashed #666;font-size:10.5px;color:var(--concrete);padding:2px 6px;direction:ltr;text-align:left}
.yr{position:absolute;left:28px;top:22px;font-family:"Jost";font-weight:800;font-size:92px;line-height:1;color:var(--bone);direction:ltr}
.yr small{display:block;font-family:var(--font);font-size:15px;font-weight:600;color:var(--concrete);margin-top:6px}
.pn{flex:1;display:flex;flex-direction:column;padding:16px 20px 12px;border-left:1px solid var(--line);min-width:0}
.hd{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.hd .no{font-family:"Jost";font-weight:800;font-size:30px;color:var(--red);line-height:1}
.hd h2{margin:0;font-size:17px;font-weight:800;flex:1}
.hd .br{font-family:"Jost";font-weight:800;font-size:13px;color:var(--concrete);direction:ltr;white-space:nowrap}
.q{font-size:21px;font-weight:800;line-height:1.4;color:#fff;margin:12px 0 10px;min-height:88px}
.pp{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sd .sh{font-size:13.5px;font-weight:800;margin-bottom:6px;min-height:20px}
.sd.a .sh{color:#ff6a4d}
.hund{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;aspect-ratio:1;background:#151514;padding:7px}
.hund i{display:block;border:1px solid #444;border-radius:2px} .hund i.u{background:var(--bone);border-color:var(--bone)}
.hund i.b{background:repeating-linear-gradient(45deg,#8a8a86 0 2px,transparent 2px 5px);border-color:#8a8a86}
.sd.a .hund i.u{background:var(--red);border-color:var(--red)}
.pitches{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-content:start;height:214px;background:#151514;padding:8px}
.pitch{display:block;width:100%;height:auto}
.coins{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;align-content:end;height:214px;background:#151514;padding:8px}
.coins i{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:50%;background:var(--bone);color:#000;font-style:normal;font-weight:800;font-size:12px;border:2px solid #8a8a86}
.sd.a .coins i{background:var(--red);border-color:#000} .coins i.pt{opacity:.45}
.pv{display:flex;align-items:baseline;gap:8px;margin-top:8px;min-height:52px}
.pv b{font-family:"Jost";font-weight:800;font-size:46px;line-height:1;color:var(--bone)} .sd.a .pv b{color:var(--red)}
.pv span{font-size:12.5px;line-height:1.35;color:#d8d5ce}
.gap{display:flex;align-items:center;gap:14px;border-top:1px solid var(--line);margin-top:10px;padding-top:8px;min-height:66px;font-size:14px;font-weight:600;line-height:1.4}
.gap .x{font-family:"Jost";font-weight:800;font-size:54px;color:var(--red);line-height:1;direction:ltr}
.src{margin-top:auto;font-size:11px;line-height:1.5;color:var(--concrete);border-top:1px solid var(--line);padding-top:6px}
.bar{position:absolute;left:0;bottom:0;height:4px;background:var(--red)}
.one{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
.one .tx{font-size:14px;line-height:1.6} .one .tx b{font-family:"Jost";font-size:22px;font-weight:800}
.cnt{font-family:"Jost";font-weight:800;font-size:64px;line-height:1;color:var(--red);direction:ltr;text-align:start}
.cnt+div{font-size:15px;font-weight:700;margin:4px 0 14px}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const Q=new URLSearchParams(location.search), G=Q.get('g')||'bus', L=Q.get('lang')||'ar', FQ=Q.get('f'), STEPS=+Q.get('steps')||10;
document.documentElement.lang=L; document.documentElement.dir=L==='en'?'ltr':'rtl';
const T=o=>typeof o==='string'?o:(o[L]||o.en), DIR=L==='en'?'ltr':'rtl';
const get=f=>fetch('data/'+f).then(r=>r.json());
const fmt=v=>Math.round(v).toLocaleString('en-US');
/* ---------- projection: equirectangular, fixed window ---------- */
const VIEW={belt:{x0:34.50,y1:31.527,s:9.55,lat:31.2},nat:{x0:32.69,y1:33.36,s:1.56,lat:31.5}};
let PJ=VIEW.belt;
const px=(lon,lat)=>[(lon-PJ.x0)*111.32*Math.cos(PJ.lat*Math.PI/180)*PJ.s,(PJ.y1-lat)*110.9*PJ.s];
const TOWNS={ // CBS locality points
 'beer sheva':{g:'j',c:[34.7843,31.2535],ar:'بئر السبع',he:'באר שבע',en:"Be'er Sheva",muni:"Be'er Sheva"},
 'rahat':{g:'a',c:[34.754,31.3901],ar:'رهط',he:'רהט',en:'Rahat',muni:'Rahat'},
 'hura':{g:'a',c:[34.9354,31.2969],ar:'حورة',he:'חורה',en:'Hura',muni:'Hura'},
 'kseifa':{g:'a',c:[35.0885,31.2433],ar:'كسيفة',he:'כסייפה',en:'Kuseife',muni:'Kseyfe'},
 'lakia':{g:'a',c:[34.8667,31.3238],ar:'اللقية',he:'לקיה',en:'Lakiya',muni:'Lakiye'},
 'tel sheva':{g:'a',c:[34.8599,31.2481],ar:'تل السبع',he:'תל שבע',en:'Tel Sheva',muni:'Tel Sheva'},
 'shegev shalom':{g:'a',c:[34.8385,31.1966],ar:'شقيب السلام',he:'שגב שלום',en:'Segev Shalom',muni:'Segev Shalom'},
 'arara negev':{g:'a',c:[35.0227,31.1581],ar:'عرعرة النقب',he:'ערערה בנגב',en:"Ar'ara",muni:"Ar'ara Banegev"},
 'netivot':{g:'j',c:[34.5824,31.422],ar:'نتيفوت',he:'נתיבות',en:'Netivot',muni:'Netivot'},
 'ofakim':{g:'j',c:[34.6201,31.3061],ar:'أوفاكيم',he:'אופקים',en:'Ofakim',muni:'Ofakim'},
 'dimona':{g:'j',c:[35.0354,31.07],ar:'ديمونا',he:'דימונה',en:'Dimona',muni:'Dimona'},
 'arad':{g:'j',c:[35.2133,31.2585],ar:'عراد',he:'ערד',en:'Arad',muni:'Arad'},
 'omer':{g:'j',c:[34.8499,31.2674],ar:'عومر',he:'עומר',en:'Omer',muni:'Omer'},
 'yeruham':{g:'j',c:[34.927,30.9873],ar:'يروحام',he:'ירוחם',en:'Yeruham',muni:'Yeroham'},
 'lehavim':{g:'j',c:[34.8118,31.3687],ar:'لهافيم',he:'להבים',en:'Lehavim',muni:'Lehavim'},
 'meytar':{g:'j',c:[34.9303,31.3274],ar:'ميتار',he:'מיתר',en:'Meitar',muni:'Meitar'},
 'mizpe ramon':{g:'j',c:[34.8009,30.6225],ar:'متسبي رمون',he:'מצפה רמון',en:'Mitzpe Ramon',muni:'Mitspe Ramon',south:[547,592]},
 'eilat':{g:'j',c:[34.9425,29.5526],ar:'إيلات',he:'אילת',en:'Eilat',muni:'Eilat',south:[642,592]}};
const tpx=(k,south)=>{const t=TOWNS[k]; return south&&t.south?t.south:px(...t.c);};
/* label nudges so names do not sit on their own symbol */
const NUDGE={'omer':[26,-12],'tel sheva':[30,10],'beer sheva':[-30,16],'lakia':[-22,-14],'meytar':[26,-14],'hura':[24,14],'lehavim':[0,-16],'shegev shalom':[0,18]};
/* ---------- geometry helpers ---------- */
const inRing=(x,y,r)=>{let ins=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const xi=r[i][0],yi=r[i][1],xj=r[j][0],yj=r[j][1];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)ins=!ins;}return ins;};
const polys=g=>g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];
const geomOf=o=>o.type==='FeatureCollection'?o.features.map(f=>f.geometry):o.type==='Feature'?[o.geometry]:o.type==='GeometryCollection'?o.geometries:[o];
function path(ctx,g){ctx.beginPath();polys(g).forEach(p=>p.forEach(r=>{r.forEach(([x,y],i)=>{const [a,b]=px(x,y);i?ctx.lineTo(a,b):ctx.moveTo(a,b);});ctx.closePath();}));}
const distM=(x1,y1,x2,y2)=>{const dx=(x1-x2)*95217,dy=(y1-y2)*110900;return Math.sqrt(dx*dx+dy*dy);};
function nearest(H,P){ // homes [[lon,lat]], points [[lon,lat]] -> metres
  return H.map(([x,y])=>{let m=1e12;for(let i=0;i<P.length;i++){const dx=(x-P[i][0])*95217,dy=(y-P[i][1])*110900,d=dx*dx+dy*dy;if(d<m)m=d;}return Math.sqrt(m);});}
let seed=7; const rnd=()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296;};
/* ---------- data ---------- */
const D={};
async function load(){
  const need={homes:['nafa','muni','vaadim','bld','bsum'],localities:['israel','cbs'],industry:['nafa','muni','indJ','indA','istats'],arnona:['nafa','muni','tprof'],
    bus:['nafa','muni','bld','stopdist','stops','access'],school:['nafa','muni','bld','svcpts','svc'],bagrut:['nafa','muni','bagrut'],sport:['nafa','muni','sportf','sport'],sportdist:['nafa','muni','bld','sportf','svc']}[G];
  const F={nafa:'negev_nafa.geojson',muni:'muni.geojson',vaadim:'vaadim.geojson',bld:'offmap_buildings.json',bsum:'buildings_summary.json',israel:'israel_outline.geojson',cbs:'cbs_localities.geojson',
    indJ:'jewishh_industrial.geojson',indA:'arabb_industrial.geojson',istats:'industry_stats.json',tprof:'town_profile.json',stopdist:'offmap_stopdist.json',stops:'transit_stops.geojson',access:'transit_access.json',
    svcpts:'services_points.geojson',svc:'services_access.json',bagrut:'bagrut.json',sportf:'sport_facilities.geojson',sport:'sport_stats.json'};
  await Promise.all(need.map(k=>get(F[k]).then(d=>{D[k]=d;})));
  if(D.muni){ const r=await get('rahat.geojson').catch(()=>null); if(r) geomOf(r).forEach(g=>D.muni.features.push({type:'Feature',geometry:g,properties:{Muni_Eng:'Rahat'}})); }
  if(D.nafa){ const g=D.nafa.features[0].geometry; D.negev=polys(g); D.inNegev=(x,y)=>!(y>31.345&&x>=34.95&&x<=35.30)&&D.negev.some(p=>inRing(x,y,p[0])); }
  if(D.bld){ // unrecognized-village homes only (class u): centroid of the first vertex is enough at this scale
    D.H=[]; D.Hd=[]; D.bld.forEach((a,k)=>{ if(a[0]==='u'){ D.H.push([a[2]/1e5,a[3]/1e5]); if(D.stopdist) D.Hd.push(D.stopdist[k]); } });
    D.E=D.bld.filter(a=>a[0]==='e').map(a=>[a[2]/1e5,a[3]/1e5]);
    D.rk=D.H.map(()=>rnd()); D.rkE=D.E.map(()=>rnd()); }
}
/* ---------- base map ---------- */
function base(ctx,o={}){
  ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,700,675);
  if(D.nafa){ const g=D.nafa.features[0].geometry; path(ctx,g); ctx.fillStyle='#191918'; ctx.fill(); ctx.strokeStyle='#4a4a47'; ctx.lineWidth=1; ctx.stroke(); }
  if(D.muni&&!o.noTowns){ const byName={}; Object.values(TOWNS).forEach(t=>byName[t.muni]=t);
    D.muni.features.forEach(f=>{const t=byName[f.properties.Muni_Eng]; if(!t) return; path(ctx,f.geometry);
      if(t.g==='j'){ctx.fillStyle='rgba(138,138,134,.22)';ctx.fill();ctx.strokeStyle='rgba(138,138,134,.75)';ctx.lineWidth=1;ctx.setLineDash([]);ctx.stroke();}
      else{ctx.fillStyle='rgba(233,230,223,.10)';ctx.fill();ctx.strokeStyle='#e9e6df';ctx.lineWidth=1.3;ctx.setLineDash([4,3]);ctx.stroke();ctx.setLineDash([]);} }); }
}
/* symbol maps (arnona, bagrut): which side of its symbol each name sits on, and small symbol shifts where two towns touch */
const SIDE={'beer sheva':'l','omer':'t','tel sheva':'r','lakia':'t','meytar':'r','hura':'r','rahat':'l','lehavim':'r','dimona':'l'};
const SIDE_EQ={...SIDE,'beer sheva':'b','omer':'l','meytar':'r','lehavim':'t'}; // all symbols the same size (bagrut)
function labels(el,o={}){ let h='';
  Object.entries(TOWNS).forEach(([k,t])=>{ if(t.south&&!o.south) return; let [x,y]=o.pos?o.pos(k):tpx(k,o.south), cl='', v=o.val?o.val(k):null;
    if(o.rad){ const r=o.rad(k)+4, sd=(o.side||SIDE)[k]||'b'; cl=sd; if(sd==='b')y+=r; else if(sd==='t')y-=r; else if(sd==='r')x+=r; else x-=r; }
    else{ const n=NUDGE[k]||[0,-14]; x+=n[0]; y+=n[1]; }
    h+=`<div class="lb ${t.g} ${cl}" style="left:${x.toFixed(0)}px;top:${y.toFixed(0)}px">${T(t)}${v!=null?`<small>${v}</small>`:''}</div>`; });
  h+=`<div class="sc" style="width:${(10*PJ.s).toFixed(0)}px"><b></b>10 km</div>`;
  if(o.south) h+=`<div class="south">${T({ar:'↓ جنوباً، خارج الإطار',he:'↓ דרומה, מחוץ למסגרת',en:'↓ further south, off frame'})}</div>`;
  el.insertAdjacentHTML('beforeend',h); }
const southBox=ctx=>{ctx.fillStyle='#0d0d0d';ctx.fillRect(505,543,187,124);};
const legend=(el,rows)=>el.insertAdjacentHTML('beforeend',`<div class="lgd" dir="${DIR}">${rows.map(([st,tx,c])=>`<div><i class="${c||''}" style="${st}"></i>${T(tx)}</div>`).join('')}</div>`);
const LJ=['background:rgba(138,138,134,.35);border:1px solid #8a8a86',{ar:'بلدة يهودية (حدود البلدية)',he:'יישוב יהודי (גבול שיפוט)',en:'Jewish town (municipal limit)'}];
const LA=['background:rgba(233,230,223,.12);border:1px dashed #e9e6df',{ar:'بلدة عربية معترف بها',he:'יישוב ערבי מוכר',en:'recognized Arab town'}];
const RAMP=['#8a8a86','#b5361f','#ff5a3c'];
function dots(ctx,P,col,r,sq){ ctx.fillStyle=col; P.forEach(([x,y])=>{const [a,b]=px(x,y); if(sq) ctx.fillRect(a-r,b-r,2*r,2*r); else{ctx.beginPath();ctx.arc(a,b,r,0,6.2832);ctx.fill();}}); }
function homesByDist(ctx,dist,thr,t){ // far homes on top
  [[d=>d<=thr,RAMP[0]],[d=>d>thr&&d<=3000,RAMP[1]],[d=>d>3000,RAMP[2]]].forEach(([f,c])=>{ctx.fillStyle=c; D.H.forEach(([x,y],i)=>{ if(D.rk[i]<=t&&f(dist[i])){const [a,b]=px(x,y);ctx.fillRect(a-.9,b-.9,1.8,1.8);} });}); }
/* ---------- side panel ---------- */
const xN=(hi,lo)=>{const r=hi/lo;return r>=10?Math.round(r):r.toFixed(1);};
function unitsHTML(kind,v,v2,cells=100){ const full=Math.floor(v+1e-9), part=v-full;
  if(kind==='pitch'){ const one=f=>`<svg viewBox="0 0 105 68" class="pitch"><rect x="0.8" y="0.8" width="103.4" height="66.4" fill="none" stroke="#5a5a55" stroke-width="1.6" stroke-dasharray="3 3"/><svg x="0" y="0" width="${(105*f).toFixed(1)}" height="68"><rect width="105" height="68" fill="#f2c230"/><g fill="none" stroke="#000" stroke-width="1.6"><rect x="1" y="1" width="103" height="66"/><path d="M52.5 1v66"/><circle cx="52.5" cy="34" r="9"/></g></svg></svg>`;
    return `<div class="pitches">${[...Array(full)].map(()=>one(1)).join('')}${part>.02?one(part):''}</div>`; }
  if(kind==='coin') return `<div class="coins">${[...Array(full)].map(()=>'<i>₪</i>').join('')}${part>.15?'<i class="pt">₪</i>':''}</div>`;
  const n=Math.floor(v+1e-6), half=v-n>=.25, n2=Math.round(v2||0);
  return `<div class="hund" style="${cells!==100?`aspect-ratio:${10/(cells/10)}`:''}">${[...Array(cells).keys()].map(k=>`<i class="${k<n?'u':k===n&&half?'u':k<n2?'b':''}"${k===n&&half&&v-n<.75?' style="opacity:.55"':''}></i>`).join('')}</div>`; }
const head=c=>`<div class="hd" dir="${DIR}"><span class="no">${c.no}</span><h2>${T(c.title)}</h2><span class="br">OFF—MAP · ${T({ar:'النقب',he:'הנגב',en:'Naqab'})}</span></div><div class="q" dir="${DIR}">${T(c.q)}</div>`;
function panelFill(c,t,fin){
  const top=Math.max(c.a,c.j), d=v=>c.dec?(+v).toFixed(c.dec):(fin&&c.kind==='home'&&!c.mul&&v<10&&Math.abs(v-Math.round(v))>.05)?(+v).toFixed(1):fmt(v);
  const side=k=>{ const v=c[k], s=fin?v:Math.min(v,t*top), s2=c[k+'2']!=null?(fin?c[k+'2']:Math.min(c[k+'2'],t*Math.max(c.a2||0,c.j2||0))):null;
    return `<div class="sd ${k}"><div class="sh">${T(c.sides[k])}</div>${unitsHTML(c.kind,s*(c.mul||1),s2,c.cells||100)}<div class="pv"><b>${c.pre||''}${d(s*(c.show||1))}</b><span>${T(c.unit)}</span></div></div>`; };
  const tiny=c.a<0.5&&c.zero;
  return head(c)+`<div class="pp" dir="${DIR}">${side('a')}${side('j')}</div>`+
    `<div class="gap" dir="${DIR}">${fin?(tiny?`<span class="x">0</span><span>${T(c.zero)}</span>`:`<span class="x">×${xN(c.j,c.a)}</span><span>${T(c.gap||{ar:'الفرق بين الجهتين',he:'הפער בין שני הצדדים',en:'the gap between the two sides'})}</span>`):''}</div>`+
    `<div class="src" dir="${DIR}">${T(c.src)}</div>`; }
const S7={ar:'7 بلدات عربية معترف بها',he:'7 יישובים ערביים מוכרים',en:'7 recognized Arab towns'}, S11={ar:'11 بلدة يهودية',he:'11 יישובים יהודיים',en:'11 Jewish towns'};
const SU={ar:'قرى غير معترف بها',he:'כפרים לא מוכרים',en:'Unrecognized villages'};
const HOMES_L=thr=>[['background:#fff',thr.pt,'c'],[`background:${RAMP[0]}`,thr.near],[`background:${RAMP[1]}`,thr.far],[`background:${RAMP[2]}`,{ar:'بيت أبعد من 3 كم',he:'בית במרחק מעל 3 ק"מ',en:'home more than 3 km away'}],LJ,LA];
const fillSeq=(n=STEPS)=>[...Array(n+1).keys()].map(k=>({t:k/n,fin:k===n}));
/* ---------- the GIFs ---------- */
const GIFS={
 homes:()=>{ const S=D.bsum, off=S.outside_recognized, inA=S.by_group.arab.buildings, sh=off/(off+inA)*100, un=S.v2.unrecognized, ex=S.v2.expansion;
   const rec=D.vaadim.features.filter(f=>['al Kasum','Neve Midbar'].includes(f.properties.Muni_Eng));
